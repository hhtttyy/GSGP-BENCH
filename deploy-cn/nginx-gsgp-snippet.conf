# nginx-gsgp-snippet.conf — 宝塔面板路径：粘贴进站点 server{} 内。
# 注意：宝塔站点「根目录」填 /www/wwwroot（gsgp 的父目录），域名栏填 IP；前缀由以下 location 提供。
charset utf-8;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

location = / { return 301 /gsgp/; }
location = /index.html { return 301 /gsgp/; }
location /gsgp/ { try_files $uri $uri/ =404; }
location /gsgp/vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /gsgp/data/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
}
location /gsgp/api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    client_max_body_size 32k;
}
include /etc/nginx/conf.d/sites/*.conf;