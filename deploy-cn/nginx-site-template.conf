# nginx-site-template.conf — add-site.sh 用模板：生成 /etc/nginx/conf.d/sites/<name>.conf，
# 被 gsgp.conf 的 server{} include；root 继承 server 的 /www/wwwroot。
# 占位符: __NAME__（站点前缀）、__API_BLOCK__（可选 AI 反代块）。
location /__NAME__/ {
    try_files $uri $uri/ =404;
}
location /__NAME__/vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /__NAME__/data/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
}
__API_BLOCK__