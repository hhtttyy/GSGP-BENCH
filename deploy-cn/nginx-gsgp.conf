# nginx-gsgp.conf — 无面板路径：完整 server 块。站点以 /gsgp/ 前缀对外（http://IP/gsgp/）。
# 放置: /etc/nginx/conf.d/gsgp.conf；站点文件仍在 /www/wwwroot/gsgp（root 指到其父目录）。
server {
    listen 80 default_server;
    server_name _;
    root /www/wwwroot;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 根路径友好跳转到本站前缀
    location = / { return 301 /gsgp/; }
    location = /index.html { return 301 /gsgp/; }

    # 本站：/gsgp/…（目录索引开启，/gsgp/bench/ 等可直接访问）
    location /gsgp/ {
        try_files $uri $uri/ =404;
    }
    location /gsgp/vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /gsgp/data/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    # 本站 AI：前缀剥离后反代回环服务（upstream 仍见 /api/…）
    location /gsgp/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        client_max_body_size 32k;
    }

    # 旧根路径链接 301 到前缀（老书签不迷路）
    location ^~ /bench/ { return 301 /gsgp$request_uri; }
    location ^~ /resources/ { return 301 /gsgp$request_uri; }
    location ^~ /css/ { return 301 /gsgp$request_uri; }
    location ^~ /data/ { return 301 /gsgp$request_uri; }
    location ^~ /vendor/ { return 301 /gsgp$request_uri; }
    location ^~ /api/ { return 301 /gsgp$request_uri; }

    # 未来站点的前缀 location 由 add-site.sh 生成于此目录
    include /etc/nginx/conf.d/sites/*.conf;

    location = /favicon.ico { access_log off; log_not_found off; }
    access_log /var/log/nginx/gsgp.access.log;
    error_log  /var/log/nginx/gsgp.error.log warn;
}