name: MCP submission
description: Submit a Paper2Agent-generated Skill/MCP package for GSGP-Bench certification
title: "[MCP] "
labels: ["mcp-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting. GSGP-Bench validates the **MCP package**, not a scientific result.
        We do not host or execute submitted MCPs for users. Unverified submissions may remain visible
        with an "unverified" label; users run them at their own risk.

  - type: input
    id: paper_title
    attributes:
      label: Paper title
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: paper_doi
    attributes:
      label: Paper DOI or URL
      placeholder: https://doi.org/...
    validations:
      required: true

  - type: input
    id: code_repo
    attributes:
      label: Official code repository
      placeholder: https://github.com/...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Pinned commit or release
      placeholder: 40-character commit SHA or release tag
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Code license
      placeholder: MIT / GPL-3.0 / other
    validations:
      required: true

  - type: textarea
    id: package
    attributes:
      label: Paper2Agent Skill/MCP package
      description: Link or path to the Skill bundle and MCP server/contract.
      placeholder: Skill path, MCP entrypoint, tools.json, version
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: MCP transport
      options:
        - stdio
        - HTTP
        - other
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: Runtime and dependencies
      description: R/Python version, packages, external binaries, containers.
    validations:
      required: true

  - type: textarea
    id: test_command
    attributes:
      label: Test command and reference input
      description: One command the central team can run, plus public/synthetic test data.
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: Expected outputs
      description: Prediction/result fields and known output files.
    validations:
      required: true

  - type: checkboxes
    id: truth
    attributes:
      label: Truth isolation
      options:
        - label: The MCP does not receive held-out truth.
          required: true
        - label: The MCP does not compute benchmark metrics internally.
          required: true

  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
      description: Missing data, version differences, failing cases, security concerns.
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact
      placeholder: GitHub handle or email
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have permission to distribute this Skill/MCP package for review.
          required: true
        - label: I understand that certification is for the package, not for scientific results.
          required: true
